; Font substitutions go in here
; Ukrainian: both game fonts go to the ONE Cyrillic font "Albertus Medium" (Albertus_Medium.ttf, registered in language.ini).
; Never point the two blocks at two different font files - see project_one_font_rule.
FontSubstitution "SachaWynter"
    Size 8 = 8 "Albertus Medium"
    Size 9 = 9 "Albertus Medium"
    Size 10 = 10 "Albertus Medium"
    Size 11 = 11 "Albertus Medium"
    Size 12 = 12 "Albertus Medium"
    Size 14 = 14 "Albertus Medium"
    Size 16 = 16 "Albertus Medium"
    Size 18 = 18 "Albertus Medium"
    Size 20 = 20 "Albertus Medium"
    Size 22 = 22 "Albertus Medium"
    Size 24 = 24 "Albertus Medium"
    Size 26 = 26 "Albertus Medium"
    Size 28 = 28 "Albertus Medium"
    Size 40 = 40 "Albertus Medium"
End

