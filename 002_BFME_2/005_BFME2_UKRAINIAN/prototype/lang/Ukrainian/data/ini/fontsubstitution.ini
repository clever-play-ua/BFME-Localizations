; Font substitutions go in here
; Format is :
   
   FontSubstitution "SachaWynter"   ; Substitute requests for Albertus MT font
    Size 8 = 8 SachaWynterTight
    Size 9 = 9 SachaWynterTight
    Size 10 = 10 SachaWynterTight
    Size 12 = 12 SachaWynterTight
    Size 14 = 14 SachaWynterTight
    Size 16 = 14 SachaWynterTight  
    Size 18 = 18 SachaWynterTight
    Size 20 = 20 SachaWynterTight
    Size 22 = 22 SachaWynterTight
    Size 24 = 24 SachaWynterTight
    Size 26 = 26 SachaWynterTight
    Size 28 = 28 SachaWynterTight
   End

   FontSubstitution "Albertus MT"   ; Substitute requests for Albertus MT font
    Size 8 = 8 "Arial"
    Size 9 = 9 "Arial"
    Size 10 = 10 "Arial"
    Size 12 = 12 "Arial"
    Size 14 = 12 "Arial"
    Size 16 = 14 "Arial"  
    Size 18 = 16 "Arial"
    Size 20 = 18 "Arial"
    Size 22 = 19 "Arial"
    Size 24 = 22 "Arial"
    Size 26 = 24 "Arial"
    Size 28 = 26 "Arial"
   End
;
; If no size mappings are specified, then the size requested by the game is the one used. 
;  If *any* size mappins are used, then the Font manager will look up the size that is either less than
;   or equal to the size requested, and return the replacement for that value. If the size requested
;  is smaller than all replacements then it will return the lowest value.
;
;  i.e. in the above example
;   Requesting 9pts or below, will return 20
;   Requesting 10 or 11pts will return 20
;   Requesting 12pts or above will return 48
